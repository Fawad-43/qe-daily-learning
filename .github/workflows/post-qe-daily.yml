name: Validate QE Daily Content

on:
  push:
    paths:
      - 'content/**'
      - 'templates/**'
      - 'scripts/validate-content.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate QE content
        run: npm run validate
